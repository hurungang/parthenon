name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Record or verify CLA acceptance
        if: >-
          github.event_name == 'pull_request_target' ||
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the Parthenon Contributor License Agreement and I hereby accept its terms.'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/hurungang/parthenon/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for the contribution. Before we can review or merge this
            pull request, please read the Parthenon CLA at $pathToCLADocument
            and reply on this PR with the exact text below:

            I have read the Parthenon Contributor License Agreement and I hereby accept its terms.
          custom-pr-sign-comment: I have read the Parthenon Contributor License Agreement and I hereby accept its terms.
          custom-allsigned-prcomment: All contributors on this pull request have accepted the Parthenon CLA.
          lock-pullrequest-aftermerge: true
          suggest-recheck: true