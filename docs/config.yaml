# Change Lifecycle Configuration
# Provides project-specific context for the /change:* workflow tools.
# All agents read this file first before starting any task.
# Run /change:init to update this file when the project evolves.

project:
  name: Parthenon
  description: >
    Enterprise AI Harness Framework — a self-hosted, identity-aware platform for managing AI agents,
    MCP tool hubs, skills, SOPs, scheduling, observability, and multi-agent communication.
    Designed for enterprise deployment with OIDC identity provider integration (Keycloak, Azure EntraID),
    role/permission management, and a management Web UI.

# Top-priority architecture rules — must be followed before all other conventions
top_priority_rules:
  - 3 backend service should be fully segregated 
  - Agent can only run in agent runtime services
  - Only Control center can connect to database
  - Agent can not get any senstivive data like identity tokens, database credentials, etc.

# Source code locations — used by agents to resolve code references
source:
  frontend: frontend/src
  backend: backend/app
  schema: backend/app/db/models/
  showcase: site/
  tests:
    - backend/tests/
    - frontend/src/__tests__/
    - e2e/tests/
    - mcp-demo-app/tests/

# Project tooling — scripts available for service management
tooling:
  management_script: parthenon.ps1
  description: >
    PowerShell script for managing all services (infra, backend, frontend).
    Supports start/stop/restart/status commands with health checks.
    See PARTHENON-SCRIPT-GUIDE.md or read the script for usage details.

# Runtime logs — locations for troubleshooting live issues
logs:
  directory: backend/logs
  files:
    - name: control-center.log
      service: Control Center (port 8000)
      purpose: HTTP request log, DB queries, orchestrator outcomes, cert validation
    - name: agent-runtime.log
      service: Agent Runtime (port 8001)
      purpose: Execution triggers, in-flight task registry, certificate middleware rejections
    - name: communication-hub.log
      service: Communication Hub (port 8002)
      purpose: Agent execute/terminate forwarding, control plane middleware decisions
    - name: otel.log
      service: OpenTelemetry Collector
      purpose: Trace/log export diagnostics (rotated separately)
  retention: files rotate at ~10 MB; .1 and .2 are kept as the two most recent rolls
  troubleshooting_notes:
    - Certificate rejections on AR: search agent-runtime.log for 'rejected' lines
    - Termination not stopping the agent: search control-center.log for 'terminate' and agent-runtime.log for '/terminate'
    - A2A routing failures: search communication-hub.log for '/internal/a2a'

# Technology stack — context for agents, not prescriptive
tech_stack:
  frontend: React 19 + TypeScript + Material-UI (MUI 7) + React Router 7 + Vite + i18next + antd + react-js-cron + cronstrue + OpenTelemetry
  backend: Python 3.11+ FastAPI + SQLAlchemy 2 (async) + Pydantic v2 + Alembic + Redis + OpenTelemetry + LangChain (deep agent framework) + cryptography (X.509 certificate management) + mcp (official MCP Python SDK — powers the Communication Hub MCP protocol server)
  database: PostgreSQL 16 — SQLAlchemy declarative models in backend/app/db/models/, Alembic migrations in backend/alembic/
  auth: OIDC/OAuth2 — supports Keycloak and Azure EntraID; JWT validation via python-jose; internal RBAC roles (user, agent, both); dual-realm topology (user realm + agent realm); certificate-based authentication for agent runtime (mTLS)
  infra: Docker Compose (dev/self-hosted) + Kubernetes/Helm (production) + nginx reverse proxy + OTEL Collector

# Key project conventions — agents follow these when making decisions
conventions:
  - "Top priority: Before applying any change, validate it against docs/config.yaml top_priority_rules and reject designs that violate those rules"
  - "All UI text must go through the i18next t() function — no hardcoded strings in components"
  - "Use strong typing everywhere — TypeScript interfaces/enums on frontend; Pydantic models and Python Enums on backend"
  - "Database schema is managed via SQLAlchemy declarative models in backend/app/db/models/ — never write raw ALTER TABLE; generate Alembic migrations with alembic revision --autogenerate"
  - "Frontend calls backend REST APIs — no direct database access from frontend (no Supabase pattern here)"
  - "All backend endpoints require JWT authentication unless explicitly marked public"
  - "Identity provider configuration at runtime is managed via database (System Config UI — `identity_provider_configs` table). The `config/identity.yaml` file is written by the setup tool for bundled Keycloak deployments and is consumed only during the one-time identity.yaml→database migration. For external OIDC providers, all configuration is set via the System Config UI; no YAML file editing is needed."
  - "First-run setup: on initial deployment with bundled Keycloak, operators run the consolidated setup command (`setup/`) which provisions the Keycloak realm, clients, admin user, database seeding, and certificate bootstrap. For external OIDC providers, operators configure identity providers via the System Config UI after logging in as super admin. A UI setup wizard remains available as a guided alternative for bundled Keycloak only."
  - "MCP server connections use encrypted credential storage (AES-256); decrypt only at call time"
  - "All inter-service communication is instrumented with OpenTelemetry traces, metrics, and logs"
  - "Telemetry configuration is managed via config/telemetry.yaml and TELEMETRY_* environment variables — operators configure export targets (console, file, OTLP, Logfire, custom), enable/disable signals (traces, metrics, logs), and set log levels without code changes"
  - "Agent identities are first-class OIDC principals — agents have their own client credentials in the identity provider"
  - "MCP server slug/alias must be unique platform-wide and is used as the namespace for all synced tools"
  - "PowerShell terminal on Windows — use ; not && to chain commands"
  - "**Dialog Error Handling Standard (CRITICAL)**: ALL dialogs with API calls MUST handle errors using this pattern: (1) Add dialogError state: `const [dialogError, setDialogError] = useState<unknown>(null)`, (2) Wrap async operations in try-catch: `try { setDialogError(null); await operation(); close dialog; } catch (err) { setDialogError(err) }`, (3) Clear error on open/close: `onClose={() => { close(); setDialogError(null) }}`, (4) Display error in DialogContent FIRST: `{dialogError && <PermissionDeniedAlert error={dialogError} fallbackMessage={t('app.error')} />}`. This ensures users see permission errors (403) and other API failures immediately in dialogs instead of silent failures. See frontend/src/hooks/useDialogErrorHandler.ts for reusable hook implementation."
  - "**Certificate-Based Authentication (Agent Runtime)**: Agent Runtime instances authenticate using agent-instance certificates (24-hour validity, CN=agent-type:instance-id); Communication Hub authenticates using service certificates (30-day validity, CN=service:name); Control Center manages Certificate Authority, issues/renews/revokes certificates, and enforces access control (agent-instance certs are blocked from /internal/* endpoints); agents never hold identity tokens — tokens are resolved by Control Center and injected by Communication Hub per tool call"
  - "**Per-Component Environment Variable Configuration**: Every infrastructure connection supports per-component env vars (POSTGRES_HOST/PORT/USER/PASSWORD/DB instead of monolithic DATABASE_URL; REDIS_HOST/PORT/PASSWORD/DB instead of monolithic REDIS_URL; OIDC_ISSUER_URL/OIDC_CLIENT_ID/OIDC_CLIENT_SECRET for identity providers). Computed properties in Settings assemble these into connection strings with fallback to monolithic vars. At startup, log_config_sources() logs the resolved source for each connection (env var, YAML file, or built-in default). Environment variables always take precedence over YAML files."
  - "**Startup Validation, Not Provisioning**: Runtime services (Control Center, Agent Runtime, Communication Hub) validate external dependency reachability at startup (PostgreSQL, OIDC provider, Redis, Control Center) and fail fast with clear, actionable error messages. Identity provider provisioning is an operator-invoked operation handled exclusively by the setup tool (`setup/`). Keycloak admin credentials (KEYCLOAK_ADMIN, KEYCLOAK_ADMIN_PASSWORD) MUST NOT be set on runtime service containers — these are consumed only by the setup tool."

# Domain knowledge — business rules agents must always know
domain:
  - "Identity provider modes: 'bundled' (Keycloak running in Docker Compose, auto-configured via setup tool or setup wizard) or 'external' (any OIDC-compliant provider like Azure EntraID, configured via System Config UI). External providers require no YAML file editing — all configuration is database-backed."
  - "Setup tool: a consolidated CLI (`setup/` directory) that replaces ad-hoc scripts for environment bootstrapping. Sub-commands: `identity` (provision Keycloak realm/clients/admin user), `database` (verify PostgreSQL readiness), `certificates` (bootstrap CA), `dev` (full dev environment bootstrap), `verify` (check existing configuration). All operations are idempotent. Separated from runtime containers — CC never holds Keycloak admin credentials."
   - "Super Admin: built-in bootstrap administrator with OIDC-independent authentication. Credentials are environment-variable based (no database storage) — `SUPER_ADMIN_USERNAME` + `SUPER_ADMIN_PASSWORD_HASH` (or plaintext `SUPER_ADMIN_PASSWORD`). Enabled via `PARTHENON_SUPER_ADMIN_ENABLED` env var; status is read-only in the System Config UI (no runtime toggle or password change). Used for first-run system config and disaster recovery."
  - "OIDC Provider Registry: singleton service (`OIDCProviderRegistry`) that loads all enabled identity provider configs from the database on startup and exposes discovery document and JWKS keys per provider. Supports independent user and agent identity providers. Reloadable at runtime via System Config UI."
  - "Role types: 'user' (human), 'agent' (AI agent), 'both' (service account usable by either). Roles carry permission sets."
  - "MCP Hub: each registered MCP server has a unique slug; all tools from that server are synced under the slug namespace; permissions are granted at tool level"
  - "MCP Sessions: multiple named sessions can be defined per MCP server with different identity/credential bindings; a session can be mapped to an agent identity or a role"
  - "Skills: named invocable units that wrap one or more MCP tool calls; Skills are the permission-grantable unit for agents"
  - "SOPs (Standard Operating Procedures): higher-level Skills composed of multiple Skills with sequencing logic; may involve agent-to-agent delegation"
  - "Agent Roles: permission sets that grant agents access to specific SOPs and/or Skills; roles resolve to a complete set of allowed MCP tools; agent identities are explicitly assigned to roles via many-to-many relationships"
  - "Agent Identities: first-class OIDC user accounts in a dedicated agent realm (e.g., ai_agents); provisioned via OAuth sign-in; tokens stored encrypted and refreshed automatically; each identity can be assigned to multiple roles"
  - "Agent Types: define agent configuration including identity, role, model, system instruction, input/output types; each agent execution validates that the identity is assigned to the role before proceeding"
  - "Model Configurations: centrally managed LLM provider configs for 12 API-key-based providers across two dispatch families (OpenAI-compatible: openai, azure_openai, litellm_proxy, mistral, groq, together, fireworks, perplexity, deepseek; native-API: anthropic, gemini, cohere) with encrypted credentials and enabled model lists; agent types reference model IDs that are resolved to configs at runtime"
  - "Agent Sessions: asynchronous execution units tracked from submission through completion; each session is an agent instance in the dashboard; powered by LangChain deep agent framework (observe-reason-act loop)"
  - "Agent Gateway: Communication Hub extended to handle agent execution requests, session tracking, and result routing; enforces OAuth au; validates agent-instance certificates and delegates permission resolution to Control Center"
  - "Control Center: manages Certificate Authority (CA), issues agent-instance and service certificates (24-hour and 30-day validity respectively), refreshes agent identity OAuth tokens automatically, resolves permissions for tool calls, enforces access control (blocks agent-instance certs from /internal/* endpoints), and maintains audit logs (certificate validation, token refresh). At startup, validates external dependency reachability (PostgreSQL, OIDC provider, Redis) and fails fast instead of auto-provisioning. Hosts the OIDC Provider Registry for multi-provider identity support."

  - "Certificate Types: agent-instance certificates identify agent runtime instances (CN=agent-type:instance-id), service certificates identify internal services like Communication Hub (CN=service:name); agent-instance certs have limited access (metadata and tool calls only), service certs have full Control Center accessthentication and role-based tool filtering"
  - "Communication Hub: central broker for Web UI ↔ agent and agent ↔ agent messaging; also serves as Agent Gateway for session management and hosts the MCP protocol server (initialize / tools/list / tools/call over Streamable HTTP and SSE) that exposes permitted tools to external MCP clients authenticated by API keys"
  - "Execution Logs: full system instruction and user prompt captured for every agent run before first LLM call; visible in UI for audit and traceability"
   - "Result Repository: read-only repository of persisted structured outputs, browsable in the UI. Agents no longer use a dedicated `save_result` MCP tool — intermediate saves go through the `save_data` system tool and final results through typed `AgentOutput` records."
  - "Notification integrations: pluggable channels (email, Slack, Teams, webhook) exposed as MCP tools"
  - "Observability: OTEL traces, metrics, and structured logs emitted by all components; collected via OTEL Collector; shipped to configurable backends (Prometheus, Jaeger, Loki, etc.)"
  - "Schedule management: cron-based scheduling for prompts and SOPs; managed via the admin UI; backed by a persistent job store"
  - "Conversation history: every interaction (user→agent, agent→agent, agent→tool) is persisted to the conversation store for audit and replay"
  - "**Resource Type Manifest Registration (CRITICAL)**: Resource types use the `module::submodule` namespace format (e.g., `agent::roles`, `integration::mcp_hub`, `system::permissions`) across 3 module groups matching the sidebar. When adding a new module that uses `require_permission()` for access control, you MUST register the resource type in BOTH: (1) `backend/app/core/resource_types.py` — add to `ResourceTypeManifest` with allowed actions AND add to the appropriate `MODULE_GROUPS`, and (2) `frontend/src/constants/resourceTypes.ts` — mirror the entry in `RESOURCE_TYPE_MANIFEST` AND the matching `MODULE_GROUPS` submodules list. Failure to do this will cause 403 Forbidden for ALL users including system admins with wildcard permissions, because the `PermissionEngine.authorize()` rejects unknown resource types BEFORE evaluating wildcard policies. Wildcards: `agent::*` (all 12 agent submodules), `integration::*` (both integration submodules), `system::*` (all 3 system submodules), `*::*` (every resource type). FreeSolo autocomplete selectors support typed wildcard patterns (e.g., `agent::mana*`)."
  - "Agent Data Type Registry: a centralized catalogue of reusable typed output schemas (AgentDataType model). Administrators define data types with typed fields (string, number, boolean, date, enum). Data types are assigned to non-conversational agent types via output_data_type_id; conversational agent types do not support typed outputs. Data types cannot be deleted while referenced by agent types."
  - "Agent Outputs: typed, schema-validated execution results (AgentOutput model). Each output links to a data type schema, the agent type, and the execution session. Outputs have a validation_status (valid or validation_error) with raw_output fallback. The Agent Outputs admin page provides filtering by data type, agent type, and date range with CSV export."
  - "System Tools — save_data: replaces legacy save_result. Agents use save_data for intermediate named data saves (zero or more per session). Each record has data_name, data_value, and is linked to agent type and session via FKs. Separate from final output which is singular per session."
  - "System Tools — get_data/get_output: agent retrieval tools. get_data queries AgentData records by data_name, agent_type_id, or session_id with at least one filter required. get_output queries AgentOutput records by agent_type_id, session_id, date_from, and date_to."
  - "System Tools — query_result: system tool allowing agents to query past typed outputs by data type name with optional date range and field filters. Routes through Communication Hub to Control Center. Resolves data type by slug first, then name."
  - "Agent Data Module: read-only API and UI (`/admin/agent-data`) for browsing intermediate data saved by agents via the `save_data` system tool. Filterable by data_name, agent_type_id, session_id. Detail drawer shows full JSON data_value. Protected by `agent::data:read` resource type. Follows the same pattern as Agent Outputs."
  - "Dashboard Metrics: operational dashboard at `/` replaced thin placeholder. Seven snapshot stat cards (Agent Types, Pending Interventions, Model Configurations, Active Schedules, Agent Identities, Agent Roles, MCP Servers) with permission checks per underlying data domain. Three time-sensitive metric cards (Guardrail Breach Events, Agent Executions completed/failed, Model Usage Posture Breaches) filtered by a DateRangePicker. Cards show 'Permission Denied' placeholder instead of 403 errors. IdP status cards retained in de-emphasized section."
  - "GitHub Pages Showcase: a fully static Vite + TypeScript project showcase website at site/. Builds to docs/site/ and auto-publishes to GitHub Pages on push to main via .github/workflows/deploy-github-pages.yml. No backend dependency. Uses Mermaid for architecture diagrams. Screenshots are placeholder SVGs."
