<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="Agent roles management mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1526"/><stop offset="1" stop-color="#131d37"/></linearGradient>
    <style>.h{font:700 28px Inter,Arial,sans-serif;fill:#eef2ff}.s{font:500 16px Inter,Arial,sans-serif;fill:#9ea8c9}.t{font:500 14px Inter,Arial,sans-serif;fill:#d5dcf4}.k{font:600 14px 'Fira Code',Consolas,monospace;fill:#a98fff}</style>
  </defs>
  <rect width="1280" height="760" fill="url(#bg)"/>
  <rect x="40" y="34" width="1200" height="64" rx="14" fill="#1b2748" stroke="#394b7d"/>
  <text x="72" y="74" class="h" font-size="24">Agent Roles and Permission Governance</text>

  <rect x="40" y="122" width="420" height="590" rx="16" fill="#182345" stroke="#4f67a8"/>
  <text x="68" y="160" class="h" font-size="20">Roles</text>
  <rect x="68" y="188" width="364" height="56" rx="10" fill="#7c5cfc"/><text x="90" y="223" class="t" fill="#fff">IncidentResponder</text>
  <rect x="68" y="256" width="364" height="56" rx="10" fill="#0f1731" stroke="#576ea8"/><text x="90" y="291" class="t">CustomerSupportBot</text>
  <rect x="68" y="324" width="364" height="56" rx="10" fill="#0f1731" stroke="#576ea8"/><text x="90" y="359" class="t">OpsAutomation</text>

  <rect x="490" y="122" width="750" height="284" rx="16" fill="#182345" stroke="#4f67a8"/>
  <text x="520" y="160" class="h" font-size="20">Assigned Skills and SOPs</text>
  <rect x="520" y="188" width="326" height="190" rx="12" fill="#0f1731" stroke="#576ea8"/>
  <text x="540" y="216" class="k">Skills</text>
  <text x="540" y="248" class="t">- triage_incident</text>
  <text x="540" y="278" class="t">- fetch_alert_context</text>
  <text x="540" y="308" class="t">- notify_oncall</text>

  <rect x="874" y="188" width="336" height="190" rx="12" fill="#0f1731" stroke="#576ea8"/>
  <text x="894" y="216" class="k">SOPs</text>
  <text x="894" y="248" class="t">- incident-response-v2</text>
  <text x="894" y="278" class="t">- customer-escalation</text>

  <rect x="490" y="428" width="750" height="284" rx="16" fill="#182345" stroke="#4f67a8"/>
  <text x="520" y="466" class="h" font-size="20">Resolved Tool Allow-List</text>
  <rect x="520" y="492" width="690" height="190" rx="12" fill="#0f1731" stroke="#576ea8"/>
  <text x="544" y="526" class="k">jira-prod.search_issues</text>
  <text x="544" y="554" class="k">jira-prod.create_comment</text>
  <text x="544" y="582" class="k">pagerduty.trigger</text>
  <text x="544" y="610" class="k">slack.post_message</text>
  <text x="544" y="646" class="t">Computed deterministically from role -> SOP -> skill -> tool</text>
</svg>
