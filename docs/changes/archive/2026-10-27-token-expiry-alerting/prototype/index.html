<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parthenon — Token Expiry Alerting Prototype</title>
<style>
  :root {
    --primary: #42a5f5;
    --primary-dark: #1e88e5;
    --primary-light: #0d2740;
    --bg: #12161c;
    --surface: #1b2129;
    --surface-2: #222a34;
    --text: #e6eaf0;
    --text2: #9aa7b5;
    --border: #2e3743;
    --success: #66bb6a;
    --success-bg: #12291a;
    --warning: #ffa726;
    --warning-bg: #33270f;
    --error: #ef5350;
    --error-bg: #331616;
    --radius: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }

  /* App bar */
  .appbar { background: #0f141a; color: var(--text); height: 56px; display: flex; align-items: center; padding: 0 24px; gap: 24px; position: sticky; top: 0; z-index: 50; box-shadow: var(--shadow); border-bottom: 1px solid var(--border); }
  .appbar .logo { font-size: 18px; font-weight: 600; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
  .appbar .badge { background: rgba(66,165,245,.18); color: var(--primary); font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .appbar .spacer { flex: 1; }
  .appbar .tenant-chip { background: rgba(66,165,245,.12); border: 1px solid rgba(66,165,245,.4); font-size: 12px; padding: 4px 12px; border-radius: 14px; display: flex; align-items: center; gap: 6px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-dark); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }

  /* Layout */
  .layout { display: flex; min-height: calc(100vh - 56px); }
  .sidebar { width: 230px; background: var(--surface); border-right: 1px solid var(--border); padding: 12px 8px; flex-shrink: 0; }
  .sidebar .section { font-size: 11px; text-transform: uppercase; color: var(--text2); padding: 12px 12px 4px; letter-spacing: .5px; }
  .sidebar a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 6px; color: var(--text); text-decoration: none; cursor: pointer; }
  .sidebar a:hover { background: var(--surface-2); }
  .sidebar a.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
  .sidebar a .count { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--error-bg); color: var(--error); border-radius: 10px; padding: 1px 7px; }
  .sidebar .icon { width: 18px; text-align: center; opacity: .85; }
  .main { flex: 1; padding: 24px 32px; max-width: 1200px; }

  /* Typography & cards */
  h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
  .subtitle { color: var(--text2); margin-bottom: 20px; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); padding: 20px 24px; margin-bottom: 20px; }
  .card h2 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  .card .card-sub { color: var(--text2); font-size: 13px; margin-bottom: 16px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > * { flex: 1; min-width: 220px; }

  /* Buttons */
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 6px; border: none; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; }
  .btn-primary { background: var(--primary-dark); color: #fff; }
  .btn-primary:hover { background: var(--primary); }
  .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  .btn-outline:hover { background: var(--primary-light); }
  .btn-text { background: transparent; color: var(--primary); padding: 6px 10px; }
  .btn-text:hover { background: var(--primary-light); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-small { padding: 4px 10px; font-size: 12px; }

  /* Chips / status */
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip.success { background: var(--success-bg); color: var(--success); } .chip.success .dot { background: var(--success); }
  .chip.warning { background: var(--warning-bg); color: var(--warning); } .chip.warning .dot { background: var(--warning); }
  .chip.error { background: var(--error-bg); color: var(--error); } .chip.error .dot { background: var(--error); }

  /* Alerts */
  .alert { display: flex; gap: 10px; padding: 12px 16px; border-radius: 6px; font-size: 13px; margin-bottom: 16px; align-items: flex-start; line-height: 1.5; }
  .alert.info { background: var(--primary-light); color: #90caf9; border: 1px solid rgba(66,165,245,.35); }
  .alert.warning { background: var(--warning-bg); color: #ffcc80; border: 1px solid rgba(255,167,38,.4); }
  .alert.success { background: var(--success-bg); color: #a5d6a7; border: 1px solid rgba(102,187,106,.4); }
  .alert.error { background: var(--error-bg); color: #ef9a9a; border: 1px solid rgba(239,83,80,.4); }

  /* Stat cards */
  .stat { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid var(--border); padding: 16px 20px; flex: 1; min-width: 200px; }
  .stat .label { font-size: 12px; text-transform: uppercase; color: var(--text2); letter-spacing: .4px; }
  .stat .value { font-size: 24px; font-weight: 700; margin: 4px 0 2px; }
  .stat .sub { font-size: 12px; color: var(--text2); }
  .stat.clickable { cursor: pointer; transition: border-color .15s; }
  .stat.clickable:hover { border-color: var(--primary); }
  .stat.error-stat.clickable:hover { border-color: var(--error); }

  /* Alert list rows */
  .alert-row { display: flex; align-items: center; gap: 12px; padding: 12px 8px; border-bottom: 1px solid var(--border); cursor: pointer; border-radius: 6px; flex-wrap: wrap; }
  .alert-row:last-child { border-bottom: none; }
  .alert-row:hover { background: var(--surface-2); }
  .alert-row .name { font-weight: 600; }
  .alert-row .meta { color: var(--text2); font-size: 12.5px; }
  .alert-row .grow { flex: 1; min-width: 160px; }

  /* Table */
  .table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .table th { text-align: left; color: var(--text2); font-size: 12px; text-transform: uppercase; padding: 8px 10px; border-bottom: 2px solid var(--border); white-space: nowrap; }
  .table td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .table tr:hover td { background: var(--surface-2); }
  .mono { font-family: Consolas, 'JetBrains Mono', monospace; }

  /* Topology diagram */
  .topo-wrap { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; overflow-x: auto; }
  .topo-node { cursor: pointer; }
  .topo-node rect.box { fill: var(--surface-2); stroke: var(--border); stroke-width: 1.5; rx: 10; }
  .topo-node:hover rect.box { stroke: var(--primary); }
  .topo-node text { fill: var(--text); font-family: 'Segoe UI', Arial, sans-serif; font-size: 13px; font-weight: 600; }
  .topo-node text.sub { fill: var(--text2); font-size: 11px; font-weight: 400; }
  .badge-warn { fill: var(--warning); }
  .badge-err { fill: var(--error); }
  .badge-ok { fill: var(--success); }
  .topo-edge { stroke: var(--text2); stroke-width: 1.5; fill: none; }
  .topo-legend { display: flex; gap: 20px; margin-top: 12px; font-size: 12.5px; color: var(--text2); flex-wrap: wrap; align-items: center; }
  .topo-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  /* Dialog */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; z-index: 100; padding: 48px 16px; overflow-y: auto; }
  .overlay.open { display: flex; }
  .dialog { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 560px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .dialog-header { padding: 18px 24px 4px; font-size: 18px; font-weight: 600; display: flex; justify-content: space-between; }
  .dialog-body { padding: 12px 24px; }
  .dialog-actions { padding: 12px 24px 20px; display: flex; justify-content: flex-end; gap: 8px; }
  .dialog .close-x { cursor: pointer; color: var(--text2); font-size: 20px; line-height: 1; background: none; border: none; }

  /* Toast */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333d49; color: #fff; padding: 12px 24px; border-radius: 6px; font-size: 14px; z-index: 200; display: none; box-shadow: 0 4px 12px rgba(0,0,0,.4); max-width: 90vw; }
  .toast.show { display: block; animation: fadein .2s; }
  @keyframes fadein { from { opacity: 0; transform: translate(-50%, 8px);} to { opacity: 1; transform: translate(-50%, 0);} }
  .divider { height: 1px; background: var(--border); margin: 16px 0; }
</style>
</head>
<body>

<!-- ===== App bar ===== -->
<div class="appbar">
  <div class="logo">🏛 Parthenon <span class="badge">prototype · token-expiry-alerting</span></div>
  <div class="spacer"></div>
  <div class="tenant-chip" title="token health data is tenant-scoped end to end">🏢 tenant: <strong>&nbsp;acme-corp</strong></div>
  <div class="avatar">ML</div>
</div>

<div class="layout">
  <!-- ===== Sidebar ===== -->
  <nav class="sidebar">
    <div class="section" data-i18n="nav.administration"></div>
    <a data-nav="dashboard" class="active"><span class="icon">📊</span> <span data-i18n="nav.dashboard"></span><span class="count" id="nav-alert-count" style="display:none;"></span></a>
    <div class="section" data-i18n="nav.agents"></div>
    <a data-nav="identities"><span class="icon">🪪</span> <span data-i18n="nav.identities"></span></a>
    <a data-nav="topology"><span class="icon">🕸️</span> <span data-i18n="nav.topology"></span></a>
    <a data-nav="execute"><span class="icon">▶️</span> <span data-i18n="nav.execute"></span></a>
    <div class="section" data-i18n="nav.integrations"></div>
    <a data-nav="mcp"><span class="icon">🔌</span> <span data-i18n="nav.mcp"></span></a>
  </nav>

  <main class="main">

    <!-- ============ PAGE: DASHBOARD ============ -->
    <section id="page-dashboard">
      <h1 data-i18n="dashboard.title"></h1>
      <p class="subtitle" data-i18n="dashboard.subtitle"></p>

      <div class="alert info">
        <span>ℹ️</span>
        <div><span data-i18n="dashboard.info"></span></div>
      </div>

      <!-- Agent Identities summary -->
      <h2 style="font-size:15px; margin:8px 0 10px;" data-i18n="dashboard.identities.heading"></h2>
      <div class="row" style="margin-bottom:20px;">
        <div class="stat clickable error-stat" onclick="go('identities')">
          <div class="label" data-i18n="dashboard.identities.expired"></div>
          <div class="value" style="color:var(--error);" id="stat-id-expired">0</div>
          <div class="sub" data-i18n="dashboard.identities.expired.sub"></div>
        </div>
        <div class="stat clickable" onclick="go('identities')">
          <div class="label" data-i18n="dashboard.identities.expiring"></div>
          <div class="value" style="color:var(--warning);" id="stat-id-expiring">0</div>
          <div class="sub" data-i18n="dashboard.identities.expiring.sub"></div>
        </div>
        <div class="stat">
          <div class="label" data-i18n="dashboard.identities.healthy"></div>
          <div class="value" style="color:var(--success);" id="stat-id-healthy">0</div>
          <div class="sub" data-i18n="dashboard.identities.healthy.sub"></div>
        </div>
      </div>

      <!-- MCP sessions summary -->
      <h2 style="font-size:15px; margin:8px 0 10px;" data-i18n="dashboard.mcp.heading"></h2>
      <div class="row" style="margin-bottom:20px;">
        <div class="stat clickable error-stat" onclick="go('mcp')">
          <div class="label" data-i18n="dashboard.mcp.expired"></div>
          <div class="value" style="color:var(--error);" id="stat-mcp-expired">0</div>
          <div class="sub" data-i18n="dashboard.mcp.expired.sub"></div>
        </div>
        <div class="stat clickable" onclick="go('mcp')">
          <div class="label" data-i18n="dashboard.mcp.expiring"></div>
          <div class="value" style="color:var(--warning);" id="stat-mcp-expiring">0</div>
          <div class="sub" data-i18n="dashboard.mcp.expiring.sub"></div>
        </div>
        <div class="stat">
          <div class="label" data-i18n="dashboard.mcp.healthy"></div>
          <div class="value" style="color:var(--success);" id="stat-mcp-healthy">0</div>
          <div class="sub" data-i18n="dashboard.mcp.healthy.sub"></div>
        </div>
      </div>

      <!-- Actionable alerts -->
      <div class="card">
        <h2 data-i18n="dashboard.alerts.heading"></h2>
        <div class="card-sub" data-i18n="dashboard.alerts.sub"></div>
        <div id="alert-list"></div>
        <div id="alert-empty" style="display:none; padding:20px 8px; color:var(--text2);">
          ✅ <span data-i18n="dashboard.alerts.empty"></span>
        </div>
      </div>
    </section>

    <!-- ============ PAGE: AGENT IDENTITIES ============ -->
    <section id="page-identities" style="display:none;">
      <h1 data-i18n="identities.title"></h1>
      <p class="subtitle" data-i18n="identities.subtitle"></p>
      <div class="alert info">
        <span>🔑</span>
        <div><span data-i18n="identities.info"></span></div>
      </div>
      <div class="card" style="padding:8px 16px;">
        <table class="table">
          <thead><tr>
            <th data-i18n="common.name"></th><th data-i18n="identities.provider"></th><th data-i18n="identities.refreshExpiry"></th><th data-i18n="common.status"></th><th style="width:170px;"></th>
          </tr></thead>
          <tbody id="id-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ============ PAGE: MCP SESSIONS ============ -->
    <section id="page-mcp" style="display:none;">
      <h1 data-i18n="mcp.title"></h1>
      <p class="subtitle" data-i18n="mcp.subtitle"></p>
      <div class="alert info">
        <span>🔌</span>
        <div><span data-i18n="mcp.info"></span></div>
      </div>
      <div class="card" style="padding:8px 16px;">
        <table class="table">
          <thead><tr>
            <th data-i18n="mcp.session"></th><th data-i18n="mcp.server"></th><th data-i18n="identities.credentialBinding"></th><th data-i18n="identities.refreshExpiry"></th><th data-i18n="common.status"></th><th style="width:170px;"></th>
          </tr></thead>
          <tbody id="mcp-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- ============ PAGE: EXECUTE (preflight) ============ -->
    <section id="page-execute" style="display:none;">
      <h1 data-i18n="execute.title"></h1>
      <p class="subtitle" data-i18n="execute.subtitle"></p>

      <div class="row" style="align-items:stretch;">
        <div class="card" style="min-width:340px;">
          <h2 data-i18n="execute.select.heading"></h2>
          <div class="card-sub" data-i18n="execute.select.sub"></div>
          <div id="agent-list"></div>
          <div style="margin-top:16px;">
            <button class="btn btn-primary" id="btn-run" onclick="openPreflight()" data-i18n="execute.run"></button>
          </div>
        </div>
        <div class="card" style="min-width:340px;">
          <h2 data-i18n="execute.detail.heading"></h2>
          <div class="card-sub" data-i18n="execute.detail.sub"></div>
          <div id="agent-detail" style="color:var(--text2);"><span data-i18n="execute.detail.empty"></span></div>
        </div>
      </div>
    </section>

    <!-- ============ PAGE: TOPOLOGY ============ -->
    <section id="page-topology" style="display:none;">
      <h1 data-i18n="topology.title"></h1>
      <p class="subtitle" data-i18n="topology.subtitle"></p>

      <div class="card">
        <h2 data-i18n="topology.canvas.heading"></h2>
        <div class="card-sub" data-i18n="topology.canvas.sub"></div>
        <div class="topo-wrap">
          <svg id="topo-svg" viewBox="0 0 860 380" width="100%" style="min-width:700px; height:auto;"></svg>
        </div>
        <div class="topo-legend">
          <span><span class="sw badge-ok"></span><span data-i18n="topology.legend.healthy"></span></span>
          <span><span class="sw badge-warn"></span><span data-i18n="topology.legend.warning"></span></span>
          <span><span class="sw badge-err"></span><span data-i18n="topology.legend.error"></span></span>
          <span style="flex:1;"></span>
          <span data-i18n="topology.hint"></span>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ===== Dialog: preflight block ===== -->
<div class="overlay" id="preflight-overlay">
  <div class="dialog">
    <div class="dialog-header"><span data-i18n="preflight.title"></span><button class="close-x" onclick="closePreflight()">✕</button></div>
    <div class="dialog-body">
      <div id="preflight-body"></div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-text" onclick="closePreflight()" data-i18n="common.cancel"></button>
      <button class="btn btn-outline" id="preflight-remediate" onclick="remediateFromPreflight()"></button>
      <button class="btn btn-primary" id="preflight-confirm" onclick="confirmRun()" data-i18n="preflight.confirm"></button>
    </div>
  </div>
</div>

<!-- ===== Dialog: remediation ===== -->
<div class="overlay" id="remediate-overlay">
  <div class="dialog">
    <div class="dialog-header"><span id="remediate-title"></span><button class="close-x" onclick="closeRemediate()">✕</button></div>
    <div class="dialog-body">
      <p style="color:var(--text2); font-size:13px; margin-bottom:12px;" id="remediate-desc"></p>
      <div class="alert info" style="margin-bottom:0;">
        <span>🛡️</span>
        <div><span data-i18n="remediate.archnote"></span></div>
      </div>
    </div>
    <div class="dialog-actions">
      <button class="btn btn-text" onclick="closeRemediate()" data-i18n="common.cancel"></button>
      <button class="btn btn-primary" id="remediate-btn" onclick="doRemediate()"></button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

  'preflight.confirm': 'Confirm & Run',
  'preflight.passed': 'All token checks passed. Executions never fail for avoidable authentication reasons.',
  'preflight.running': 'Execution submitted — running with validated tokens.',
  'preflight.fixFirst': 'Refresh or re-authenticate the blocked credentials first.',

  'remediate.identity.title': 'Re-authenticate Agent Identity',
  'remediate.mcp.title': 'Refresh MCP Session',
  'remediate.identity.desc': 'The refresh token for {name} has expired. Re-authentication opens the identity provider sign-in ({idp}) and stores new tokens encrypted in Control Center.',
  'remediate.mcp.desc': 'MCP session {name} on server {server} has an expired credential binding. Refreshing re-resolves the bound credential via Control Center.',
  'remediate.identity.btn': 'Open IdP Sign-in',
  'remediate.mcp.btn': 'Refresh Now',
  'remediate.archnote': 'Architectural guarantee: agents never receive or hold tokens. All refresh and resolution remains under Control Center control.',
  'remediate.done.identity': '{name} re-authenticated — token refreshed, alert cleared.',
  'remediate.done.mcp': 'Session {name} refreshed — new credential resolved, alert cleared.',

  'topology.title': 'Agent Topology',
  'topology.subtitle': 'Token health is reflected directly on the composition canvas: containers whose identity or MCP session is expiring show a warning badge; expired show an error badge.',
  'topology.canvas.heading': 'report-generator — Composition',
  'topology.canvas.sub': 'Badges show the worst token state of each container (identity + MCP sessions). Click a container to remediate.',
  'topology.legend.healthy': 'Healthy (beyond 7 days)',
  'topology.legend.warning': 'Expiring within 7 days',
  'topology.legend.error': 'Expired — execution will be blocked',
  'topology.hint': 'Tenant: acme-corp',
  'topology.sub.identity': 'identity: {name}',
  'topology.sub.tools': '{n} MCP tools',
  'topology.sub.root': 'root agent'
};

function t(key, params) {
  let s = I18N[key] || key;
  if (params) for (const [k, v] of Object.entries(params)) s = s.replace('{' + k + '}', v);
  return s;
}
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
}

/* ================= Data (placeholder, tenant-scoped) ================= */
const state = {
  identities: [
    { id: 'id-report-bot', name: 'svc-report-bot', idp: 'Keycloak (agent realm)', days: -3 },   // expired
    { id: 'id-crm-reader', name: 'crm-data-reader', idp: 'Azure EntraID', days: 5 },            // expiring
    { id: 'id-mail-sender', name: 'mail-notifier', idp: 'Keycloak (agent realm)', days: 41 },   // healthy
    { id: 'id-erp-agent', name: 'erp-integration', idp: 'Azure EntraID', days: 88 },            // healthy
  ],
  mcpSessions: [
    { id: 'mcp-jira-w', name: 'jira-writer', server: 'jira-prod', binding: 'svc-report-bot', days: -3 },
    { id: 'mcp-crm-r', name: 'crm-reader', server: 'crm-api', binding: 'crm-data-reader', days: 5 },
    { id: 'mcp-docs', name: 'docs-search', server: 'sharepoint', binding: 'role:content-editors', days: 60 },
  ],
  agents: [
    { id: 'ag-report', name: 'report-generator', identity: 'id-report-bot', subagents: ['ag-crm-pull'], mcps: ['mcp-jira-w'], desc: 'Nightly management report; pulls CRM data, writes to Jira.' },
    { id: 'ag-crm-pull', name: 'crm-puller', identity: 'id-crm-reader', subagents: [], mcps: ['mcp-crm-r'], desc: 'Pulls CRM datasets via MCP tools.' },
    { id: 'ag-mailer', name: 'mail-notifier', identity: 'id-mail-sender', subagents: [], mcps: ['mcp-docs'], desc: 'Sends notification emails with document references.' },
  ],
  selectedAgent: null,
  pendingRemediation: null,   // {kind:'identity'|'mcp', id, fromPreflight:bool}
};

const healthOf = days => days < 0 ? 'error' : days <= 7 ? 'warning' : 'success';

/* ================= Routing ================= */
function go(page) {
  document.querySelectorAll('.main > section').forEach(s => s.style.display = 'none');
  document.getElementById('page-' + page).style.display = '';
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.toggle('active', a.dataset.nav === page));
}

/* ================= Toast ================= */
let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ================= Dashboard ================= */
function expiryLabel(days) {
  return days < 0 ? t('expires.ago', { n: -days }) : t('expires.in', { n: days });
}
function chip(state) {
  return `<span class="chip ${state}"><span class="dot"></span>${t('status.' + (state === 'error' ? 'expired' : state === 'warning' ? 'expiring' : 'healthy'))}</span>`;
}

function renderDashboard() {
  const c = (arr, h) => arr.filter(x => healthOf(x.days) === h).length;
  document.getElementById('stat-id-expired').textContent = c(state.identities, 'error');
  document.getElementById('stat-id-expiring').textContent = c(state.identities, 'warning');
  document.getElementById('stat-id-healthy').textContent = c(state.identities, 'success');
  document.getElementById('stat-mcp-expired').textContent = c(state.mcpSessions, 'error');
  document.getElementById('stat-mcp-expiring').textContent = c(state.mcpSessions, 'warning');
  document.getElementById('stat-mcp-healthy').textContent = c(state.mcpSessions, 'success');

  const alerts = [];
  state.identities.forEach(i => {
    const h = healthOf(i.days);
    if (h !== 'success') alerts.push({ kind: 'identity', h, name: i.name, meta: `${t('dashboard.identities.heading')} · ${i.idp} · ${expiryLabel(i.days)}` });
  });
  state.mcpSessions.forEach(m => {
    const h = healthOf(m.days);
    if (h !== 'success') alerts.push({ kind: 'mcp', h, name: m.name, meta: `${t('dashboard.mcp.heading')} · ${m.server} · ${expiryLabel(m.days)}` });
  });
  const order = { error: 0, warning: 1 };
  alerts.sort((a, b) => order[a.h] - order[b.h]);

  const list = document.getElementById('alert-list');
  list.innerHTML = alerts.map(a => `
    <div class="alert-row" onclick="${a.kind === 'identity' ? `openRemediate('identity','${a.name}')` : `openRemediate('mcp','${a.name}')`}">
      ${chip(a.h)}
      <div class="grow">
        <div class="name">${a.name}</div>
        <div class="meta">${a.meta}</div>
      </div>
      <button class="btn btn-small ${a.h === 'error' ? 'btn-primary' : 'btn-outline'}">${a.kind === 'identity' ? t('dashboard.alerts.cta.identity') : t('dashboard.alerts.cta.mcp')}</button>
    </div>`).join('');
  document.getElementById('alert-empty').style.display = alerts.length ? 'none' : '';

  // sidebar badge
  const n = alerts.filter(a => a.h === 'error').length + 0;
  const badge = document.getElementById('nav-alert-count');
  const total = alerts.length;
  badge.style.display = total ? '' : 'none';
  badge.textContent = total;
}

/* ================= Identity & MCP tables ================= */
function renderIdentities() {
  document.getElementById('id-tbody').innerHTML = state.identities.map(i => {
    const h = healthOf(i.days);
    return `<tr>
      <td class="mono">${i.name}</td>
      <td>${i.idp}</td>
      <td class="mono">${expiryLabel(i.days)}</td>
      <td>${chip(h)}</td>
      <td style="text-align:right;">
        ${h === 'success'
          ? `<button class="btn btn-text btn-small" onclick="toast('${t('identities.view')}: ${i.name}')">${t('identities.view')}</button>`
          : `<button class="btn ${h === 'error' ? 'btn-primary' : 'btn-outline'} btn-small" onclick="openRemediate('identity','${i.name}')">${t('identities.reauth')}</button>`}
      </td>
    </tr>`;
  }).join('');
}

function renderMcp() {
  document.getElementById('mcp-tbody').innerHTML = state.mcpSessions.map(m => {
    const h = healthOf(m.days);
    return `<tr>
      <td class="mono">${m.name}</td>
      <td class="mono">${m.server}</td>
      <td class="mono">${m.binding}</td>
      <td class="mono">${expiryLabel(m.days)}</td>
      <td>${chip(h)}</td>
      <td style="text-align:right;">
        ${h === 'success'
          ? `<button class="btn btn-text btn-small" onclick="toast('${t('mcp.view')}: ${m.name}')">${t('mcp.view')}</button>`
          : `<button class="btn ${h === 'error' ? 'btn-primary' : 'btn-outline'} btn-small" onclick="openRemediate('mcp','${m.name}')">${t('mcp.refresh')}</button>`}
      </td>
    </tr>`;
  }).join('');
}

/* ================= Remediation ================= */
function findIdentity(name) { return state.identities.find(i => i.name === name); }
function findMcp(name) { return state.mcpSessions.find(m => m.name === name); }

function openRemediate(kind, name, fromPreflight) {
  state.pendingRemediation = { kind, name, fromPreflight: !!fromPreflight };
  const overlay = document.getElementById('remediate-overlay');
  const btn = document.getElementById('remediate-btn');
  if (kind === 'identity') {
    const i = findIdentity(name);
    document.getElementById('remediate-title').textContent = t('remediate.identity.title');
    document.getElementById('remediate-desc').textContent = t('remediate.identity.desc', { name, idp: i.idp });
    btn.textContent = t('remediate.identity.btn');
  } else {
    const m = findMcp(name);
    document.getElementById('remediate-title').textContent = t('remediate.mcp.title');
    document.getElementById('remediate-desc').textContent = t('remediate.mcp.desc', { name, server: m.server });
    btn.textContent = t('remediate.mcp.btn');
  }
  overlay.classList.add('open');
}
function closeRemediate() { document.getElementById('remediate-overlay').classList.remove('open'); }

function doRemediate() {
  const r = state.pendingRemediation;
  if (!r) return;
  if (r.kind === 'identity') {
    findIdentity(r.name).days = 90;
    toast(t('remediate.done.identity', { name: r.name }));
  } else {
    findMcp(r.name).days = 60;
    toast(t('remediate.done.mcp', { name: r.name }));
  }
  closeRemediate();
  renderAll();
  if (r.fromPreflight) refreshPreflightAfterFix(r);
}

/* ================= Execute / preflight ================= */
function renderAgentList() {
  document.getElementById('agent-list').innerHTML = state.agents.map(a => {
    const sel = state.selectedAgent === a.id;
    return `<div class="alert-row" style="cursor:pointer; ${sel ? 'background:var(--primary-light);' : ''}" onclick="selectAgent('${a.id}')">
      <span style="font-size:18px;">🤖</span>
      <div class="grow">
        <div class="name" style="${sel ? 'color:var(--primary);' : ''}">${a.name}</div>
        <div class="meta">${a.desc}</div>
      </div>
    </div>`;
  }).join('');
}

function worstHealth(agent, visited) {
  visited = visited || new Set();
  if (visited.has(agent.id)) return 'success';
  visited.add(agent.id);
  let worst = healthOf(findIdentity(agent.identity).days);
  agent.mcps.forEach(m => {
    const h = healthOf(findMcp(m).days);
    if (h === 'error' || (h === 'warning' && worst !== 'error')) worst = h === 'warning' && worst === 'success' ? 'warning' : (h === 'error' ? 'error' : worst);
  });
  agent.subagents.forEach(sid => {
    const h = worstHealth(state.agents.find(a => a.id === sid), visited);
    if (h === 'error' || (h === 'warning' && worst === 'success')) worst = h;
  });
  return worst;
}

function selectAgent(id) {
  state.selectedAgent = id;
  renderAgentList();
  const a = state.agents.find(x => x.id === id);
  const subs = a.subagents.map(sid => state.agents.find(x => x.id === sid));
  document.getElementById('agent-detail').innerHTML = `
    <div style="margin-bottom:12px;">
      <div class="meta" style="color:var(--text2); font-size:12px; text-transform:uppercase; margin-bottom:4px;">${t('execute.detail.identity')}</div>
      <div class="alert-row" style="cursor:pointer;" onclick="identityHealthClick('${findIdentity(a.identity).name}')">
        <span style="font-size:16px;">🪪</span>
        <div class="grow"><div class="name mono">${findIdentity(a.identity).name}</div></div>
        ${chip(healthOf(findIdentity(a.identity).days))}
      </div>
    </div>
    ${subs.length ? `<div style="margin-bottom:12px;">
      <div class="meta" style="color:var(--text2); font-size:12px; text-transform:uppercase; margin-bottom:4px;">${t('execute.detail.subagents')}</div>
      ${subs.map(s => `
        <div class="alert-row" style="cursor:pointer;" onclick="identityHealthClick('${findIdentity(s.identity).name}')">
          <span style="font-size:16px;">🤖</span>
          <div class="grow"><div class="name mono">${s.name}</div></div>
          ${chip(healthOf(findIdentity(s.identity).days))}
        </div>`).join('')}
    </div>` : ''}
    <div>
      <div class="meta" style="color:var(--text2); font-size:12px; text-transform:uppercase; margin-bottom:4px;">${t('execute.detail.mcpTools')}</div>
      ${a.mcps.map(m => {
        const s = findMcp(m);
        return `<div class="alert-row" style="cursor:pointer;" onclick="mcpHealthClick('${s.name}')">
          <span style="font-size:16px;">🔌</span>
          <div class="grow"><div class="name mono">${s.server} / ${s.name}</div><div class="meta">${t('execute.detail.mcpSession')}: ${s.binding}</div></div>
          ${chip(healthOf(s.days))}
        </div>`;
      }).join('')}
    </div>`;
}

function identityHealthClick(name) {
  const i = findIdentity(name);
  if (healthOf(i.days) !== 'success') openRemediate('identity', name);
}
function mcpHealthClick(name) {
  const m = findMcp(name);
  if (healthOf(m.days) !== 'success') openRemediate('mcp', name);
}

function collectBlockers(agent, visited) {
  visited = visited || new Set();
  if (visited.has(agent.id)) return [];
  visited.add(agent.id);
  const out = [];
  const id = findIdentity(agent.identity);
  if (healthOf(id.days) !== 'success')
    out.push({ kind: 'identity', h: healthOf(id.days), label: id.name, detail: `${t('preflight.item.identity')} · ${id.idp} · ${expiryLabel(id.days)}`, owner: agent.name });
  agent.mcps.forEach(mid => {
    const m = findMcp(mid);
    if (healthOf(m.days) !== 'success')
      out.push({ kind: 'mcp', h: healthOf(m.days), label: m.name, detail: `${t('preflight.item.mcp')} · ${m.server} · ${expiryLabel(m.days)}`, owner: agent.name });
  });
  agent.subagents.forEach(sid => out.push(...collectBlockers(state.agents.find(a => a.id === sid), visited)));
  return out;
}

function openPreflight() {
  if (!state.selectedAgent) { toast(t('execute.detail.empty')); return; }
  const a = state.agents.find(x => x.id === state.selectedAgent);
  const blockers = collectBlockers(a);
  const body = document.getElementById('preflight-body');
  const confirm = document.getElementById('preflight-confirm');
  const fix = document.getElementById('preflight-remediate');
  if (blockers.length) {
    body.innerHTML = `
      <div class="alert error"><span>⛔</span><div>${t('preflight.blocked')}</div></div>
      ${blockers.map(b => `
        <div class="alert-row">
          ${chip(b.h)}
          <div class="grow">
            <div class="name mono">${b.label} <span class="meta">(${b.owner})</span></div>
            <div class="meta">${b.detail}</div>
          </div>
        </div>`).join('')}`;
    confirm.style.display = 'none';
    fix.style.display = '';
    fix.textContent = t('preflight.fix');
  } else {
    body.innerHTML = `
      <div class="alert success"><span>✅</span><div>${t('preflight.passed')}</div></div>
      <div class="alert-row" style="cursor:default;">
        <span style="font-size:16px;">🤖</span>
        <div class="grow"><div class="name mono">${a.name}</div><div class="meta">${a.desc}</div></div>
        ${chip('success')}
      </div>`;
    confirm.style.display = '';
    fix.style.display = 'none';
  }
  document.getElementById('preflight-overlay').classList.add('open');
}
function closePreflight() { document.getElementById('preflight-overlay').classList.remove('open'); }

function remediateFromPreflight() {
  if (!state.selectedAgent) return;
  const a = state.agents.find(x => x.id === state.selectedAgent);
  const blockers = collectBlockers(a);
  if (!blockers.length) return;
  const b = blockers[0];
  closePreflight();
  openRemediate(b.kind, b.label, true);
}

function refreshPreflightAfterFix(r) {
  const a = state.agents.find(x => x.id === state.selectedAgent);
  if (!a) { go('execute'); return; }
  selectAgent(a.id);
  if (collectBlockers(a).length === 0) {
    go('execute');
    openPreflight();  // now passes — user sees the green path immediately
  } else {
    openPreflight();  // still blocked — show remaining blockers
  }
}

function confirmRun() {
  closePreflight();
  toast(t('preflight.running'));
}

/* ================= Topology ================= */
function renderTopology() {
  const svg = document.getElementById('topo-svg');
  const report = state.agents.find(a => a.id === 'ag-report');
  const crm = state.agents.find(a => a.id === 'ag-crm-pull');
  function badge(x, y, h) {
    const cls = h === 'error' ? 'badge-err' : h === 'warning' ? 'badge-warn' : 'badge-ok';
    const glyph = h === 'error' ? '!' : h === 'warning' ? '!' : '✓';
    return `<circle cx="${x}" cy="${y}" r="11" class="${cls}"/><text x="${x}" y="${y + 4}" text-anchor="middle" style="fill:#12161c; font-size:12px; font-weight:700;">${glyph}</text>`;
  }
  function node(x, y, w, title, sub, h, onclick) {
    return `<g class="topo-node" onclick="${onclick}">
      <rect class="box" x="${x}" y="${y}" width="${w}" height="76"/>
      <text x="${x + 16}" y="${y + 28}">${title}</text>
      <text class="sub" x="${x + 16}" y="${y + 48}">${sub[0]}</text>
      <text class="sub" x="${x + 16}" y="${y + 64}">${sub[1]}</text>
      ${badge(x + w - 4, y + 4, h)}
    </g>`;
  }
  const hRoot = worstHealth(report), hSub = worstHealth(crm);
  svg.innerHTML = `
    <path class="topo-edge" d="M 470 200 C 560 200 560 130 650 130"/>
    <path class="topo-edge" d="M 470 220 C 560 240 560 280 650 280"/>
    <path class="topo-edge" d="M 200 210 L 290 210"/>
    ${node(40, 172, 160, '⏰ Nightly Cron', [t('topology.sub.root'), '02:00 UTC'], 'success', `toast('Scheduler trigger — healthy')`)}
    ${node(290, 162, 180, '🤖 ' + report.name, [
        t('topology.sub.identity', { name: findIdentity(report.identity).name }),
        '🔌 ' + t('topology.sub.tools', { n: report.mcps.length })], hRoot,
      `topoClick('${report.id}')`)}
    ${node(650, 92, 180, '🤖 ' + crm.name, [
        t('topology.sub.identity', { name: findIdentity(crm.identity).name }),
        '🔌 ' + t('topology.sub.tools', { n: crm.mcps.length })], hSub,
      `topoClick('${crm.id}')`)}
    ${node(650, 242, 180, '✉️ mail-notifier', [
        t('topology.sub.identity', { name: findIdentity('id-mail-sender').name }),
        '🔌 ' + t('topology.sub.tools', { n: 1 })], 'success', `toast('mail-notifier — healthy')`)}
    ${node(40, 24, 260, '🗝️ Token Health', ['Control Center resolves & refreshes', 'all tokens — agents hold none'], 'success', `go('dashboard')`)}
    <path class="topo-edge" d="M 170 100 C 240 120 240 150 290 170" stroke-dasharray="4 4"/>
  `;
}
function topoClick(agentId) {
  const a = state.agents.find(x => x.id === agentId);
  const id = findIdentity(a.identity);
  const h = healthOf(id.days);
  if (h === 'error') openRemediate('identity', id.name);
  else if (h === 'warning') openRemediate('identity', id.name);
  else {
    const m = a.mcps.map(findMcp).find(m => healthOf(m.days) !== 'success');
    if (m) openRemediate('mcp', m.name);
    else toast(a.name + ' — ' + t('status.healthy'));
  }
}

/* ================= Render all ================= */
function renderAll() {
  applyI18n();
  renderDashboard();
  renderIdentities();
  renderMcp();
  renderAgentList();
  if (state.selectedAgent) selectAgent(state.selectedAgent);
  renderTopology();
}
renderAll();
</script>
</body>
