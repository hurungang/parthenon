[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "parthenon-client"
version = "0.1.0"
description = "Python SDK for Parthenon third-party agent integration (clients)."
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["parthenon*"]
